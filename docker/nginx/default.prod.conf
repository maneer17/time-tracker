# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name timetracker.manar.page;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name timetracker.manar.page;

    ssl_certificate     /etc/letsencrypt/live/timetracker.manar.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timetracker.manar.page/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> PHP-FPM
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        # Tells Laravel the original request was secure
        fastcgi_param HTTPS on;
        # TODO (your checkpoint): which directive handles long export downloads?
    }

    # WebSockets -> Reverb
    location ^~ /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend (single-page app)
    location / {
        try_files $uri $uri/ /index.html;
    }
}