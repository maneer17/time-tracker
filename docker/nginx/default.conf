server {
    listen 80;
    server_name _;
    # PROD: server_name your-domain.com;
    # PROD: add a second server block that listens on 443 ssl, with
    #       ssl_certificate and ssl_certificate_key from /etc/letsencrypt/live/<domain>/
    #       and make this port-80 block redirect to https, except for the
    #       /.well-known/acme-challenge/ path certbot needs.

    root /usr/share/nginx/html;
    index index.html;

    # API -> PHP-FPM (FastCGI)
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        # PROD: fastcgi_param HTTPS on;   (so Laravel knows the original request was secure)
        # TODO (your checkpoint): export downloads can run longer than nginx's default
        #      FastCGI timeout. Which directive would you add here?
    }

    # WebSockets -> Reverb
    location ^~ /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # PROD: proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else -> the single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}