name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you also run it from the Actions tab

concurrency:
  group: deploy # never run two deploys at the same time
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.VM_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run deploy script on the VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST"
